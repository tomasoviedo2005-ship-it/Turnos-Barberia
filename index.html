<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b10">
<title>Tomás Oviedo — Turnos</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#050b10;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}
:root{--blue:#2389ff;--green:#16c76b;--red:#ff3150;--card:#0b141c;--line:#25333f}
.app{max-width:1100px;margin:auto;padding:22px}
header{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:22px;text-align:center}
.brand{font-weight:900;font-size:30px;color:var(--blue);letter-spacing:2px}
.sub{font-size:12px;color:#9da8b1;letter-spacing:3px;margin-top:3px}
button{border:0;cursor:pointer;font-weight:800}
.primary{background:var(--blue);color:#111;padding:13px 18px;border-radius:13px}
.days{display:flex;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;background:#0b141c;border:1px solid var(--line);border-radius:14px;margin-bottom:20px}
.daytab{min-width:105px;flex:0 0 auto;padding:11px 8px;background:transparent;color:#aeb8c0;font-size:13px}
.daytab.active{color:var(--blue);box-shadow:inset 0 -3px var(--blue)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.card{background:linear-gradient(145deg,#0b141c,#071018);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:160px}
h2{margin:0 0 12px;color:var(--blue);font-size:20px}
.slot{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;border:1px solid #25333f;border-radius:13px;padding:10px;margin:9px 0;background:#09121a}
.time{font-size:17px;font-weight:900;background:#111d27;padding:9px;border-radius:10px;text-align:center}
.status{font-size:11px;font-weight:900;padding:6px 9px;border-radius:20px;display:inline-block}
.free{color:#fff;background:var(--green)}
.busy{color:#fff;background:var(--red)}
.name{font-weight:800;margin-top:5px}
.service{font-size:12px;color:#9da8b1;margin-top:3px}
.actions button{background:transparent;color:#dbe2e7;font-size:18px;margin-left:3px}
.empty{text-align:center;color:#9da8b1;padding:20px}
.fab{position:fixed;right:25px;bottom:25px;width:58px;height:58px;border-radius:50%;background:var(--blue);font-size:28px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.box{width:min(440px,100%);background:#0b141c;border:1px solid var(--line);border-radius:20px;padding:22px}
.box h3{margin-top:0;color:var(--blue)}
label{display:block;font-size:12px;color:#aeb8c0;margin:12px 0 6px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#071018;color:#fff;font-size:16px}
.formbuttons{display:flex;gap:10px;margin-top:18px}
.secondary{background:#17222b;color:#fff;padding:12px 16px;border-radius:10px}
footer{margin-top:25px;padding:18px;color:#aeb8c0;font-size:13px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
footer a{color:#aeb8c0;text-decoration:none}
footer a:hover{color:var(--blue)}
.social-link{display:inline-flex;align-items:center;gap:8px;color:#aeb8c0}
.social-link svg{width:22px;height:22px;fill:currentColor;stroke:currentColor;stroke-width:1.8}
.social-link:first-child svg{stroke:none;fill:#25D366}
.social-link:nth-child(2) svg{fill:none;stroke:#E1306C}
.social-link:nth-child(2) svg circle:last-child{fill:#E1306C;stroke:none}
.copy-availability{display:block;width:100%;margin:0 0 20px;padding:13px 18px;border:1px solid #263746;border-radius:13px;background:#111b23;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.copy-availability:active{transform:scale(.99)}

/* Detalles de barbería */
.barber-logo{
  display:flex;
  align-items:center;
  gap:12px;
}
.logo-mark{
  width:52px;
  height:52px;
  border:2px solid var(--blue);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#08131d;
  color:var(--blue);
  font-size:25px;
  font-weight:900;
  box-shadow:0 0 18px #2389ff33;
}
.logo-text{display:flex;flex-direction:column}
.barber-icon{
  position:absolute;
  opacity:.06;
  right:30px;
  top:5px;
  font-size:95px;
  pointer-events:none;
}
.closed-day{
  min-height:190px;
  border:1px dashed #334553;
  border-radius:16px;
  background:linear-gradient(145deg,#0a131b,#071018);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-align:center;
}
.closed-day .closed-icon{
  font-size:42px;
  color:var(--blue);
  transform:rotate(-15deg);
}
.closed-day strong{font-size:22px;color:#fff;letter-spacing:2px}
.closed-day span{font-size:13px;color:#9da8b1}
.barber-tools{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:0 0 18px;
}
.tool{
  width:44px;
  height:44px;
  border:1px solid #25333f;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b141c;
  font-size:22px;
}
.section-title{
  text-align:center;
  color:#9da8b1;
  font-size:12px;
  letter-spacing:3px;
  margin:-8px 0 14px;
}

.tools-row{display:flex;gap:10px;margin-bottom:20px;justify-content:center;flex-wrap:wrap}
.tools-row .copy-availability,.reset-week{margin:0}
.reset-week{padding:10px 14px;border-radius:10px;background:#111b23;color:#7f8b95;border:1px solid #1c2730;font-weight:700;cursor:pointer;font-size:12px}.reset-area{display:flex;justify-content:center;margin:32px 0 8px}
.reset-week:active{transform:scale(.99)}
@media(max-width:760px){
 .app{padding:14px}
 .grid{grid-template-columns:1fr}
 .brand{font-size:22px}
 header .primary{display:none}
 .slot{grid-template-columns:65px 1fr auto}
}
</style>

<body>

      <div class="brand">TOMÁS OVIEDO</div>
      <div class="sub">BARBERÍA · TURNOS</div>
    </div>
  </div>
</header>


<div class="days" id="tabs"></div>

<div class="tools-row">
  <button class="copy-availability" id="copyAvailability">
    Copiar disponibilidad
  </button>
</div>

<div class="grid" id="cards"></div>

<div class="reset-area">
  <button class="reset-week" id="resetWeek">Reiniciar semana</button>
</div>

<footer>

</div>


<div class="modal" id="modal">
<div class="box">
<h3 id="modalTitle">Agregar turno</h3>

<label>Día</label>
<select id="day"></select>

<label>Horario</label>
<select id="time"></select>

<label>Nombre del cliente</label>
<input id="name" placeholder="Ej: Juan Pérez">

<label>Servicio (opcional)</label>
<input id="service" placeholder="Ej: Corte">

<div class="formbuttons">
<button class="primary" onclick="saveBooking()">Guardar</button>
<button class="secondary" onclick="closeModal()">Cancelar</button>
</div>
</div>
</div>

<script>
const days = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const schedule = {
  "Lunes":["18:00","19:00","20:00","21:00"],
  "Martes":["14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00"],
  "Miércoles":["15:00","16:00","17:00","18:00","19:00","20:00","21:00"],
  "Jueves":["14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00"],
  "Viernes":["14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00"],
  "Sábado":["14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00"]
};

const $ = id => document.getElementById(id);
const tabsEl = $("tabs");
const cardsEl = $("cards");
const modalEl = $("modal");
const dayEl = $("day");
const timeEl = $("time");
const nameEl = $("name");
const serviceEl = $("service");
const titleEl = $("modalTitle");

let bookings = {};
try {
  bookings = JSON.parse(localStorage.getItem("tomas_oviedo_bookings") || "{}");
} catch(e) {
  bookings = {};
}

let selectedDay = "Lunes";
let editingKey = null;

function key(d,t){
  return d + "_" + t;
}

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function persist(){
  try{
    localStorage.setItem("tomas_oviedo_bookings",JSON.stringify(bookings));
    return true;
  }catch(e){
    alert("El navegador no permite guardar los turnos. Abrí la página directamente en Safari o Chrome y probá de nuevo.");
    return false;
  }
}

function render(){
  tabsEl.innerHTML = days.map(d =>
    `<button class="daytab ${d===selectedDay?'active':''}" onclick="selectDay('${d}')">${d}</button>`
  ).join("");

  const times = schedule[selectedDay] || [];
  cardsEl.innerHTML = `
    <div class="card" style="grid-column:1/-1">
      <h2>Turnos del ${selectedDay}</h2>
      ${times.length
        ? times.map(t=>{
          const b = bookings[key(selectedDay,t)];

          return `<div class="slot">
            <div class="time">${t}</div>
            <div>
              ${b
                ? `<span class="status busy">OCUPADO</span>
                   <div class="name">${esc(b.name)}</div>
                   <div class="service">${esc(b.service || "")}</div>`
                : `<span class="status free">DISPONIBLE</span>
                   <div class="service">Podés agendar este turno</div>`
              }
            </div>

            <div class="actions">
              ${b
                ? `<button title="Editar" onclick="editBooking('${selectedDay}','${t}')">✎</button>
                   <button title="Eliminar" onclick="deleteBooking('${selectedDay}','${t}')">🗑</button>`
                : `<button title="Agendar" onclick="openNewFor('${selectedDay}','${t}')">＋</button>`
              }
            </div>
          </div>`;
        }).join("")
        : `<div class="empty">No hay turnos cargados para este día.</div>`
      }
    </div>`;
}

function selectDay(d){
  selectedDay = d;
  render();
}

function fillDays(){
  dayEl.innerHTML = days.map(d =>
    `<option value="${d}">${d}</option>`
  ).join("");
  updateTimes();
}

function updateTimes(){
  const d = dayEl.value;
  timeEl.innerHTML = (schedule[d] || []).map(t =>
    `<option value="${t}">${t}</option>`
  ).join("");
}

dayEl.addEventListener("change",updateTimes);

function openNewFor(d,t){
  editingKey = null;
  titleEl.textContent = "Agregar turno";
  fillDays();
  dayEl.value = d;
  updateTimes();
  timeEl.value = t;
  nameEl.value = "";
  serviceEl.value = "";
  modalEl.classList.add("show");
}

function openNew(){
  editingKey = null;
  titleEl.textContent = "Agregar turno";
  fillDays();
  dayEl.value = selectedDay;
  updateTimes();
  nameEl.value = "";
  serviceEl.value = "";
  modalEl.classList.add("show");
}

function editBooking(d,t){
  editingKey = key(d,t);
  titleEl.textContent = "Editar turno";
  fillDays();
  dayEl.value = d;
  updateTimes();
  timeEl.value = t;
  nameEl.value = bookings[editingKey].name;
  serviceEl.value = bookings[editingKey].service || "";
  modalEl.classList.add("show");
}

function saveBooking(){
  const d = dayEl.value;
  const t = timeEl.value;
  const n = nameEl.value.trim();
  const svc = serviceEl.value.trim();

  if(!n){
    alert("Poné el nombre del cliente.");
    return;
  }

  const newKey = key(d,t);
  const old = editingKey;

  if(bookings[newKey] && newKey !== old){
    alert("Ese turno ya está ocupado.");
    return;
  }

  if(old && old !== newKey){
    delete bookings[old];
  }

  bookings[newKey] = {
    name:n,
    service:svc
  };

  if(persist()){
    selectedDay = d;
    closeModal();
    render();
  }
}

function deleteBooking(d,t){
  const k = key(d,t);

  if(bookings[k] && confirm(`¿Sacar el turno de ${bookings[k].name}?`)){
    delete bookings[k];
    if(persist()) render();
  }
}

function closeModal(){
  modalEl.classList.remove("show");
}

function resetWeek(){
  const total = Object.keys(bookings).length;
  if(!total){
    alert("No hay turnos agendados para reiniciar.");
    return;
  }
  if(confirm("¿Querés borrar todos los turnos agendados y comenzar una semana nueva? Esta acción no se puede deshacer.")){
    bookings = {};
    if(persist()){
      render();
      alert("Semana reiniciada. Todos los turnos quedaron disponibles.");
    }
  }
}

document.getElementById("resetWeek").addEventListener("click", resetWeek);

async function copyAvailability(){
  const d = selectedDay;
  const free = (schedule[d] || []).filter(t => !bookings[key(d,t)]);
  let msg;

  if(free.length){
    msg = `Estos son los turnos que quedan disponibles para el día ${d}:\n\n`;
    free.forEach(t => msg += `• ${t}\n`);
    msg += `\nDecime cuál te queda mejor y te lo agendo.`;
  }else{
    msg = `Estos son los turnos que quedan disponibles para el día ${d}:\n\nNo quedan turnos disponibles.`;
  }

  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(msg);
    }else{
      throw new Error("clipboard");
    }
    alert("Disponibilidad del día copiada.");
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=msg; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
    alert("Disponibilidad del día copiada.");
  }
}
$("copyAvailability").addEventListener("click",copyAvailability);

window.openNew = openNew;
window.openNewFor = openNewFor;
window.saveBooking = saveBooking;
window.closeModal = closeModal;
window.editBooking = editBooking;
window.deleteBooking = deleteBooking;
window.selectDay = selectDay;

render();
</script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>

</body>
